  <body id="body">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
  <script type="text/javascript">
      window.onload = function () {
        // load local storage and set body's background color
        var theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        try {
          var storedTheme = JSON.parse(localStorage.getItem("colorTheme"));
          if (storedTheme && storedTheme["fixed"]) {
            theme = storedTheme["fixed"];
          }
        } catch (e) {
          // Fall back to the system color theme.
        }
        if (theme == "dark") {
            document.getElementById("body").style.backgroundColor = "#040916";
            } else {
            document.getElementById("body").style.backgroundColor = "#f1f2f6";
        }
      }
  </script>
